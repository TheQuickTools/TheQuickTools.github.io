<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hash Generator - MD5, SHA-256, SHA-512 | QuickTools</title>
  <meta name="description" content="Free hash generator. Generate MD5, SHA-1, SHA-256, and SHA-512 hashes from any text input.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white'>⚡</text></svg>">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1474582897184725" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header"><div class="header-inner"><a href="/" class="logo"><div class="logo-icon">⚡</div> QuickTools</a><button class="nav-toggle" aria-label="Menu">☰</button><nav class="nav"><a href="/#dev" class="nav-link active">Developer</a></nav></div></header>
  <main class="tool-page">
    <div class="breadcrumb"><a href="/">Home</a> <span>/</span> <a href="/#dev">Developer</a> <span>/</span> Hash Generator</div>
    <h1>Hash Generator</h1>
    <p class="tool-desc">Generate cryptographic hashes from any text. All computation happens in your browser.</p>

    <div class="result-card" style="background:transparent;border:none;padding:0;">
      <div class="form-group"><label>Input Text</label><textarea id="hashInput" rows="3" oninput="genHashes()" placeholder="Enter text to hash..."></textarea></div>
    </div>

    <div id="hashResults">
      <div class="result-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-weight:600;font-size:0.9rem;">SHA-256</span>
          <button class="btn btn-secondary" style="padding:4px 10px;font-size:0.75rem;" onclick="copyText(document.getElementById('h256').textContent)">Copy</button>
        </div>
        <div id="h256" style="font-family:var(--font-mono);font-size:0.8rem;word-break:break-all;color:var(--text-muted);">-</div>
      </div>
      <div class="result-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-weight:600;font-size:0.9rem;">SHA-512</span>
          <button class="btn btn-secondary" style="padding:4px 10px;font-size:0.75rem;" onclick="copyText(document.getElementById('h512').textContent)">Copy</button>
        </div>
        <div id="h512" style="font-family:var(--font-mono);font-size:0.8rem;word-break:break-all;color:var(--text-muted);">-</div>
      </div>
      <div class="result-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-weight:600;font-size:0.9rem;">SHA-1</span>
          <button class="btn btn-secondary" style="padding:4px 10px;font-size:0.75rem;" onclick="copyText(document.getElementById('h1').textContent)">Copy</button>
        </div>
        <div id="h1" style="font-family:var(--font-mono);font-size:0.8rem;word-break:break-all;color:var(--text-muted);">-</div>
      </div>
    </div>
  </main>
  <footer class="footer"><div class="footer-links"><a href="/">Home</a></div><p>&copy; 2026 QuickTools.</p></footer>
  <script src="../js/app.js"></script>
  <script>
    async function genHashes() {
      const text = document.getElementById('hashInput').value;
      const buf = new TextEncoder().encode(text);

      for (const [alg, elId] of [['SHA-256','h256'],['SHA-512','h512'],['SHA-1','h1']]) {
        try {
          const hash = await crypto.subtle.digest(alg, buf);
          const hex = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
          document.getElementById(elId).textContent = hex;
        } catch(e) {
          document.getElementById(elId).textContent = 'Error';
        }
      }
    }
  </script>
</body>
</html>
