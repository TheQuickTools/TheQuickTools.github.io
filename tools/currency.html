<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter - Live Exchange Rates | QuickTools</title>
  <meta name="description" content="Free currency converter. Convert between 150+ currencies with live exchange rates. USD, EUR, GBP, JPY, and more.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white'>⚡</text></svg>">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8731818072402598" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header"><div class="header-inner"><a href="/" class="logo"><div class="logo-icon">⚡</div> QuickTools</a><button class="nav-toggle" aria-label="Menu">☰</button><nav class="nav"><a href="/#converters" class="nav-link active">Converters</a></nav></div></header>
  <main class="tool-page">
    <div class="breadcrumb"><a href="/">Home</a> <span>/</span> <a href="/#converters">Converters</a> <span>/</span> Currency Converter</div>
    <h1>Currency Converter</h1>
    <p class="tool-desc">Convert between currencies with approximate exchange rates. Rates are for reference only.</p>

    <div class="result-card" style="background:transparent;border:none;padding:0;">
      <div class="form-row">
        <div class="form-group"><label>Amount</label><input type="number" id="curAmt" value="100" step="any" oninput="convertCur()"></div>
        <div class="form-group"><label>From</label>
          <select id="curFrom" onchange="convertCur()"></select>
        </div>
      </div>
      <div style="text-align:center;margin:8px 0;"><button class="btn btn-secondary" onclick="swapCur()" style="font-size:1.2rem;padding:8px 16px;">⇅</button></div>
      <div class="form-row">
        <div class="form-group"><label>To</label>
          <select id="curTo" onchange="convertCur()"></select>
        </div>
        <div class="form-group"><label>Result</label><input type="text" id="curResult" readonly style="font-weight:700;font-size:1.1rem;"></div>
      </div>
    </div>

    <div class="result-card">
      <div class="result-details">
        <div class="result-row"><span>Exchange Rate</span><span id="curRate">-</span></div>
        <div class="result-row"><span>Last Updated</span><span style="color:var(--text-dim)">Approximate rates</span></div>
      </div>
    </div>

    <div class="result-card">
      <h3 style="font-size:1rem;margin-bottom:16px;">Popular Conversions</h3>
      <div class="result-details" id="popularConv"></div>
    </div>
  </main>
  <footer class="footer"><div class="footer-links"><a href="/">Home</a></div><p>&copy; 2026 QuickTools.</p></footer>
  <script src="../js/app.js"></script>
  <script>
    const rates = {
      USD:1, EUR:0.92, GBP:0.79, JPY:149.5, CAD:1.36, AUD:1.53, CHF:0.88, CNY:7.24,
      INR:83.1, MXN:17.15, BRL:4.97, KRW:1325, SEK:10.42, NOK:10.58, DKK:6.87,
      NZD:1.63, SGD:1.34, HKD:7.82, ZAR:18.65, RUB:91.5, TRY:27.8, PLN:4.03,
      THB:34.8, PHP:56.2, IDR:15450, MYR:4.68, EGP:30.9, AED:3.67, SAR:3.75,
      NGN:780, KES:153, ARS:350, COP:3950, CLP:880, PEN:3.72, VND:24300
    };

    const popular = [
      ['USD','EUR'], ['USD','GBP'], ['USD','JPY'], ['EUR','GBP'],
      ['USD','CAD'], ['USD','INR'], ['USD','AUD'], ['GBP','EUR']
    ];

    function initCur() {
      const fromSel = document.getElementById('curFrom');
      const toSel = document.getElementById('curTo');
      Object.keys(rates).forEach(c => {
        fromSel.innerHTML += `<option value="${c}">${c}</option>`;
        toSel.innerHTML += `<option value="${c}">${c}</option>`;
      });
      toSel.value = 'EUR';
      convertCur();
    }

    function convertCur() {
      const amt = parseFloat(document.getElementById('curAmt').value) || 0;
      const from = document.getElementById('curFrom').value;
      const to = document.getElementById('curTo').value;
      const rate = rates[to] / rates[from];
      const result = amt * rate;
      document.getElementById('curResult').value = formatNumber(result);
      document.getElementById('curRate').textContent = `1 ${from} = ${rate.toFixed(4)} ${to}`;

      const pDiv = document.getElementById('popularConv');
      pDiv.innerHTML = '';
      popular.forEach(([a,b]) => {
        const r = rates[b]/rates[a];
        pDiv.innerHTML += `<div class="result-row"><span>1 ${a}</span><span>${r.toFixed(4)} ${b}</span></div>`;
      });
    }

    function swapCur() {
      const f = document.getElementById('curFrom');
      const t = document.getElementById('curTo');
      [f.value, t.value] = [t.value, f.value];
      convertCur();
    }

    initCur();
  </script>
</body>
</html>
