<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip Calculator - Split Bills & Calculate Tips | QuickTools</title>
  <meta name="description" content="Free tip calculator. Calculate tips, split bills between friends, and see per-person amounts instantly.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white'>⚡</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header"><div class="header-inner"><a href="/" class="logo"><div class="logo-icon">⚡</div> QuickTools</a><button class="nav-toggle" aria-label="Menu">☰</button><nav class="nav"><a href="/#finance" class="nav-link active">Finance</a></nav></div></header>
  <main class="tool-page">
    <div class="breadcrumb"><a href="/">Home</a> <span>/</span> <a href="/#finance">Finance</a> <span>/</span> Tip Calculator</div>
    <h1>Tip Calculator</h1>
    <p class="tool-desc">Calculate tips and split bills quickly. Perfect for restaurants, group dinners, and takeout.</p>

    <div class="result-card" style="background:transparent;border:none;padding:0;">
      <div class="form-group"><label>Bill Amount</label><input type="text" id="billAmt" value="" placeholder="Enter bill amount" inputmode="decimal"></div>
      <div class="form-group">
        <label>Tip Percentage: <strong id="tipPctLabel">20%</strong></label>
        <input type="range" id="tipSlider" min="0" max="40" value="20" step="1">
      </div>
      <div class="form-row">
        <div class="form-group"><label>Split Between</label><input type="number" id="splitCount" value="1" min="1" max="30"></div>
        <div class="form-group" style="display:flex;align-items:flex-end;"><button class="btn btn-primary" style="width:100%" onclick="calcTip()">Calculate</button></div>
      </div>
    </div>

    <div id="tipResults" style="display:none;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="result-card" style="text-align:center;">
          <div class="result-label">Tip Amount</div>
          <div class="result-value" id="tipAmount" style="font-size:1.5rem;">$0</div>
        </div>
        <div class="result-card" style="text-align:center;">
          <div class="result-label">Total</div>
          <div class="result-value" id="tipTotal" style="font-size:1.5rem;">$0</div>
        </div>
      </div>
      <div class="result-card" style="text-align:center;">
        <div class="result-label">Per Person</div>
        <div class="result-value" id="perPerson" style="font-size:2rem;">$0</div>
      </div>
      <div class="result-card">
        <div class="result-details">
          <div class="result-row"><span>Bill</span><span id="tipBill">-</span></div>
          <div class="result-row"><span>Tip (20%)</span><span id="tipAmt2">-</span></div>
          <div class="result-row"><span>Total</span><span id="tipTot2">-</span></div>
        </div>
      </div>
    </div>
  </main>
  <footer class="footer"><div class="footer-links"><a href="/">Home</a></div><p>&copy; 2026 QuickTools.</p></footer>
  <script src="../js/app.js"></script>
  <script>
    const slider = document.getElementById('tipSlider');
    slider.addEventListener('input', () => {
      document.getElementById('tipPctLabel').textContent = slider.value + '%';
      calcTip();
    });
    document.getElementById('billAmt').addEventListener('input', calcTip);
    document.getElementById('splitCount').addEventListener('input', calcTip);

    function calcTip() {
      const bill = parseFloat(document.getElementById('billAmt').value.replace(/[^0-9.]/g,'')) || 0;
      const pct = parseInt(slider.value) / 100;
      const split = parseInt(document.getElementById('splitCount').value) || 1;
      if (bill <= 0) { document.getElementById('tipResults').style.display='none'; return; }

      const tip = bill * pct;
      const total = bill + tip;
      const per = total / split;

      document.getElementById('tipAmount').textContent = formatCurrency(tip);
      document.getElementById('tipTotal').textContent = formatCurrency(total);
      document.getElementById('perPerson').textContent = formatCurrency(per);
      document.getElementById('tipBill').textContent = formatCurrency(bill);
      document.getElementById('tipAmt2').textContent = formatCurrency(tip);
      document.getElementById('tipTot2').textContent = formatCurrency(total);
      document.getElementById('tipResults').style.display = 'block';
    }
  </script>
</body>
</html>
