<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorem Ipsum Generator - Placeholder Text | QuickTools</title>
  <meta name="description" content="Free lorem ipsum generator. Generate placeholder text for designs, mockups, and layouts. Customizable paragraph count and style.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white'>⚡</text></svg>">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1474582897184725" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header"><div class="header-inner"><a href="/" class="logo"><div class="logo-icon">⚡</div> QuickTools</a><button class="nav-toggle" aria-label="Menu">☰</button><nav class="nav"><a href="/#text" class="nav-link active">Text</a></nav></div></header>
  <main class="tool-page">
    <div class="breadcrumb"><a href="/">Home</a> <span>/</span> <a href="/#text">Text</a> <span>/</span> Lorem Ipsum Generator</div>
    <h1>Lorem Ipsum Generator</h1>
    <p class="tool-desc">Generate placeholder text for your designs and mockups.</p>

    <div class="result-card" style="background:transparent;border:none;padding:0;">
      <div class="form-row">
        <div class="form-group"><label>Paragraphs</label><input type="number" id="liCount" value="3" min="1" max="20"></div>
        <div class="form-group"><label>Style</label>
          <select id="liStyle"><option value="classic">Classic Latin</option><option value="english">English</option><option value="random">Random Words</option></select>
        </div>
      </div>
      <div class="form-group"><button class="btn btn-primary" style="width:100%" onclick="genLorem()">Generate</button></div>
    </div>

    <div class="result-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <span class="result-label">Generated Text</span>
        <button class="btn btn-secondary" style="padding:6px 12px;font-size:0.8rem;" onclick="copyText(document.getElementById('liOutput').textContent)">Copy</button>
      </div>
      <div id="liOutput" style="font-size:0.9rem;line-height:1.7;color:var(--text-muted);"></div>
    </div>
  </main>
  <footer class="footer"><div class="footer-links"><a href="/">Home</a></div><p>&copy; 2026 QuickTools.</p></footer>
  <script src="../js/app.js"></script>
  <script>
    const loremWords = 'lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua enim ad minim veniam quis nostrud exercitation ullamco laboris nisi aliquip ex ea commodo consequat duis aute irure in reprehenderit voluptate velit esse cillum fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt in culpa qui officia deserunt mollit anim id est laborum'.split(' ');
    const engWords = 'the quick brown fox jumps over the lazy dog a company needs to establish itself as a reliable player in the market by providing quality products and services that meet customer needs building trust and maintaining strong relationships with clients is essential for long term success and growth in the competitive business landscape of today'.split(' ');

    function genLorem() {
      const count = parseInt(document.getElementById('liCount').value);
      const style = document.getElementById('liStyle').value;
      let output = [];

      for (let p = 0; p < count; p++) {
        const len = 30 + Math.floor(Math.random() * 50);
        let words = [];
        const pool = style === 'english' ? engWords : loremWords;
        for (let w = 0; w < len; w++) {
          if (style === 'random') {
            words.push(Math.random().toString(36).substring(2, 6 + Math.floor(Math.random() * 6)));
          } else {
            words.push(pool[Math.floor(Math.random() * pool.length)]);
          }
        }
        words[0] = words[0].charAt(0).toUpperCase() + words[0].slice(1);
        output.push(words.join(' ') + '.');
      }

      document.getElementById('liOutput').textContent = output.join('\n\n');
    }
    genLorem();
  </script>
</body>
</html>
