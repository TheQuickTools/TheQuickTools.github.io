<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Zone Converter - World Clock | QuickTools</title>
  <meta name="description" content="Free time zone converter. Convert time between any two time zones. See world clock and find the best meeting time.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white'>⚡</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header"><div class="header-inner"><a href="/" class="logo"><div class="logo-icon">⚡</div> QuickTools</a><button class="nav-toggle" aria-label="Menu">☰</button><nav class="nav"><a href="/#converters" class="nav-link active">Converters</a></nav></div></header>
  <main class="tool-page">
    <div class="breadcrumb"><a href="/">Home</a> <span>/</span> <a href="/#converters">Converters</a> <span>/</span> Time Zone Converter</div>
    <h1>Time Zone Converter</h1>
    <p class="tool-desc">Convert time between time zones. See current times around the world.</p>

    <div class="result-card" style="background:transparent;border:none;padding:0;">
      <div class="form-row">
        <div class="form-group"><label>Date & Time</label><input type="datetime-local" id="tzFrom" oninput="convertTZ()"></div>
        <div class="form-group"><label>From Time Zone</label>
          <select id="tzFromZone" onchange="convertTZ()"></select>
        </div>
      </div>
      <div style="text-align:center;margin:8px 0;"><button class="btn btn-secondary" onclick="swapTZ()" style="font-size:1.2rem;padding:8px 16px;">⇅</button></div>
      <div class="form-row">
        <div class="form-group"><label>To Time Zone</label>
          <select id="tzToZone" onchange="convertTZ()"></select>
        </div>
        <div class="form-group"><label>Converted Time</label><input type="text" id="tzResult" readonly style="font-weight:700;font-size:1.1rem;"></div>
      </div>
    </div>

    <div class="result-card">
      <h3 style="font-size:1rem;margin-bottom:16px;">World Clock</h3>
      <div class="result-details" id="worldClock"></div>
    </div>
  </main>
  <footer class="footer"><div class="footer-links"><a href="/">Home</a></div><p>&copy; 2026 QuickTools.</p></footer>
  <script src="../js/app.js"></script>
  <script>
    const tzs = [
      ['UTC','UTC'],['EST','America/New_York'],['CST','America/Chicago'],['MST','America/Denver'],['PST','America/Los_Angeles'],
      ['HST','Pacific/Honolulu'],['AKST','America/Anchorage'],['GMT','Europe/London'],['CET','Europe/Paris'],['EET','Europe/Helsinki'],
      ['IST','Asia/Kolkata'],['CST_CN','Asia/Shanghai'],['JST','Asia/Tokyo'],['KST','Asia/Seoul'],['AEST','Australia/Sydney'],
      ['NZST','Pacific/Auckland'],['BRT','America/Sao_Paulo'],['MSK','Europe/Moscow'],['IST_IE','Europe/Dublin'],['SAST','Africa/Johannesburg']
    ];

    function initTZ() {
      const fromSel = document.getElementById('tzFromZone');
      const toSel = document.getElementById('tzToZone');
      tzs.forEach(([name]) => {
        fromSel.innerHTML += `<option value="${name}">${name}</option>`;
        toSel.innerHTML += `<option value="${name}">${name}</option>`;
      });
      fromSel.value = 'EST'; toSel.value = 'CET';
      const now = new Date();
      document.getElementById('tzFrom').value = new Date(now - now.getTimezoneOffset()*60000).toISOString().slice(0,16);
      convertTZ();
      updateWorldClock();
      setInterval(updateWorldClock, 60000);
    }

    function getOffset(name) {
      const map = { UTC:0, EST:-5, CST:-6, MST:-7, PST:-8, HST:-10, AKST:-9, GMT:0, CET:1, EET:2, IST:5.5, CST_CN:8, JST:9, KST:9, AEST:10, NZST:12, BRT:-3, MSK:3, IST_IE:0, SAST:2 };
      return (map[name] || 0) * 3600000;
    }

    function convertTZ() {
      const dt = new Date(document.getElementById('tzFrom').value);
      if (isNaN(dt)) return;
      const fromZ = document.getElementById('tzFromZone').value;
      const toZ = document.getElementById('tzToZone').value;
      const diff = getOffset(toZ) - getOffset(fromZ);
      const result = new Date(dt.getTime() + diff);
      document.getElementById('tzResult').value = result.toLocaleString('en-US', {
        weekday:'short', year:'numeric', month:'short', day:'numeric',
        hour:'2-digit', minute:'2-digit', hour12:true
      });
    }

    function swapTZ() {
      const f = document.getElementById('tzFromZone');
      const t = document.getElementById('tzToZone');
      [f.value, t.value] = [t.value, f.value];
      convertTZ();
    }

    function updateWorldClock() {
      const now = new Date();
      const div = document.getElementById('worldClock');
      div.innerHTML = '';
      ['UTC','EST','CST','PST','GMT','CET','IST','JST','AEST'].forEach(z => {
        const t = new Date(now.getTime() + getOffset(z));
        div.innerHTML += `<div class="result-row"><span>${z}</span><span style="font-family:var(--font-mono)">${t.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true})}</span></div>`;
      });
    }

    initTZ();
  </script>
</body>
</html>
