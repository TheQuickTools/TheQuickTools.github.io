<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Converter - Uppercase, Lowercase, camelCase | QuickTools</title>
  <meta name="description" content="Free text case converter. Convert to UPPERCASE, lowercase, Title Case, camelCase, snake_case, kebab-case, and more.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white'>⚡</text></svg>">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8731818072402598" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header"><div class="header-inner"><a href="/" class="logo"><div class="logo-icon">⚡</div> QuickTools</a><button class="nav-toggle" aria-label="Menu">☰</button><nav class="nav"><a href="/#text" class="nav-link active">Text</a></nav></div></header>
  <main class="tool-page">
    <div class="breadcrumb"><a href="/">Home</a> <span>/</span> <a href="/#text">Text</a> <span>/</span> Case Converter</div>
    <h1>Case Converter</h1>
    <p class="tool-desc">Convert text between different cases instantly. Click any button to copy the result.</p>

    <div class="form-group"><textarea id="ccInput" rows="4" placeholder="Enter text to convert..." oninput="convertCase()" style="font-size:1rem;"></textarea></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <button class="btn btn-secondary" onclick="ccOut('upper')" style="text-align:left;">UPPER CASE</button>
      <button class="btn btn-secondary" onclick="ccOut('lower')" style="text-align:left;">lower case</button>
      <button class="btn btn-secondary" onclick="ccOut('title')" style="text-align:left;">Title Case</button>
      <button class="btn btn-secondary" onclick="ccOut('sentence')" style="text-align:left;">Sentence case</button>
      <button class="btn btn-secondary" onclick="ccOut('camel')" style="text-align:left;">camelCase</button>
      <button class="btn btn-secondary" onclick="ccOut('pascal')" style="text-align:left;">PascalCase</button>
      <button class="btn btn-secondary" onclick="ccOut('snake')" style="text-align:left;">snake_case</button>
      <button class="btn btn-secondary" onclick="ccOut('kebab')" style="text-align:left;">kebab-case</button>
      <button class="btn btn-secondary" onclick="ccOut('constant')" style="text-align:left;">CONSTANT_CASE</button>
      <button class="btn btn-secondary" onclick="ccOut('dot')" style="text-align:left;">dot.case</button>
      <button class="btn btn-secondary" onclick="ccOut('path')" style="text-align:left;">path/case</button>
      <button class="btn btn-secondary" onclick="ccOut('reverse')" style="text-align:left;">rEvErSe CaSe</button>
    </div>

    <div class="result-card" id="ccResultCard" style="display:none;margin-top:16px;">
      <div class="result-label">Result (click to copy)</div>
      <div id="ccResult" style="font-family:var(--font-mono);font-size:0.95rem;word-break:break-all;cursor:pointer;padding:8px 0;" onclick="copyText(this.textContent)"></div>
    </div>
  </main>
  <footer class="footer"><div class="footer-links"><a href="/">Home</a></div><p>&copy; 2026 QuickTools.</p></footer>
  <script src="../js/app.js"></script>
  <script>
    function ccOut(type) {
      const text = document.getElementById('ccInput').value;
      if (!text) return;
      let result;
      const words = text.split(/\s+/);
      switch(type) {
        case 'upper': result = text.toUpperCase(); break;
        case 'lower': result = text.toLowerCase(); break;
        case 'title': result = words.map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' '); break;
        case 'sentence': result = text.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g, c => c.toUpperCase()); break;
        case 'camel': result = words.map((w,i) => i ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : w.toLowerCase()).join(''); break;
        case 'pascal': result = words.map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(''); break;
        case 'snake': result = words.map(w => w.toLowerCase()).join('_'); break;
        case 'kebab': result = words.map(w => w.toLowerCase()).join('-'); break;
        case 'constant': result = words.map(w => w.toUpperCase()).join('_'); break;
        case 'dot': result = words.map(w => w.toLowerCase()).join('.'); break;
        case 'path': result = words.map(w => w.toLowerCase()).join('/'); break;
        case 'reverse': result = text.split('').map((c,i) => i%2 ? c.toUpperCase() : c.toLowerCase()).join(''); break;
      }
      document.getElementById('ccResult').textContent = result;
      document.getElementById('ccResultCard').style.display = 'block';
    }
  </script>
</body>
</html>
