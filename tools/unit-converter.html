<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter - Length, Weight, Temperature, Volume | QuickTools</title>
  <meta name="description" content="Free unit converter. Convert between length, weight, temperature, volume, speed, and area. Metric and imperial units.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white'>⚡</text></svg>">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1474582897184725" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header"><div class="header-inner"><a href="/" class="logo"><div class="logo-icon">⚡</div> QuickTools</a><button class="nav-toggle" aria-label="Menu">☰</button><nav class="nav"><a href="/#converters" class="nav-link active">Converters</a></nav></div></header>
  <main class="tool-page">
    <div class="breadcrumb"><a href="/">Home</a> <span>/</span> <a href="/#converters">Converters</a> <span>/</span> Unit Converter</div>
    <h1>Unit Converter</h1>
    <p class="tool-desc">Convert between length, weight, temperature, volume, speed, and area units instantly.</p>

    <div class="result-card" style="background:transparent;border:none;padding:0;">
      <div class="form-group"><label>Category</label>
        <select id="ucat" onchange="updateUnits()">
          <option value="length">Length</option>
          <option value="weight">Weight / Mass</option>
          <option value="temp">Temperature</option>
          <option value="volume">Volume</option>
          <option value="speed">Speed</option>
          <option value="area">Area</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group"><label>From</label>
          <select id="ufrom" onchange="convert()"></select>
        </div>
        <div class="form-group"><label>To</label>
          <select id="uto" onchange="convert()"></select>
        </div>
      </div>
      <div class="form-group"><label>Value</label><input type="number" id="uval" value="1" step="any" oninput="convert()"></div>
    </div>

    <div class="result-card" style="text-align:center;">
      <div class="result-label">Result</div>
      <div class="result-value" id="uresult">-</div>
      <div style="color:var(--text-dim);font-size:0.85rem;margin-top:8px;" id="uformula"></div>
    </div>
  </main>
  <footer class="footer"><div class="footer-links"><a href="/">Home</a></div><p>&copy; 2026 QuickTools.</p></footer>
  <script src="../js/app.js"></script>
  <script>
    const units = {
      length: { meters:1, km:1000, cm:0.01, mm:0.001, mi:1609.344, yd:0.9144, ft:0.3048, in:0.0254 },
      weight: { kg:1, g:0.001, mg:0.000001, lb:0.453592, oz:0.0283495, ton:1000 },
      temp: { celsius:'C', fahrenheit:'F', kelvin:'K' },
      volume: { liter:1, ml:0.001, gallon:3.78541, quart:0.946353, cup:0.236588, fl_oz:0.0295735, m3:1000 },
      speed: { 'm/s':1, 'km/h':0.277778, 'mph':0.44704, 'knots':0.514444, 'ft/s':0.3048 },
      area: { 'm²':1, 'km²':1000000, 'cm²':0.0001, 'ha':10000, 'acre':4046.86, 'ft²':0.092903, 'in²':0.00064516 }
    };

    function updateUnits() {
      const cat = document.getElementById('ucat').value;
      const fromSel = document.getElementById('ufrom');
      const toSel = document.getElementById('uto');
      fromSel.innerHTML = ''; toSel.innerHTML = '';
      Object.keys(units[cat]).forEach(u => {
        const name = u.replace(/_/g,' ');
        fromSel.innerHTML += `<option value="${u}">${name}</option>`;
        toSel.innerHTML += `<option value="${u}">${name}</option>`;
      });
      if (cat !== 'temp') {
        const keys = Object.keys(units[cat]);
        toSel.selectedIndex = Math.min(1, keys.length-1);
      }
      convert();
    }

    function convert() {
      const cat = document.getElementById('ucat').value;
      const from = document.getElementById('ufrom').value;
      const to = document.getElementById('uto').value;
      const val = parseFloat(document.getElementById('uval').value);
      if (isNaN(val)) return;

      let result;
      if (cat === 'temp') {
        let celsius;
        if (from === 'celsius') celsius = val;
        else if (from === 'fahrenheit') celsius = (val - 32) * 5/9;
        else celsius = val - 273.15;

        if (to === 'celsius') result = celsius;
        else if (to === 'fahrenheit') result = celsius * 9/5 + 32;
        else result = celsius + 273.15;
      } else {
        const base = val * units[cat][from];
        result = base / units[cat][to];
      }

      const fromName = from.replace(/_/g,' ');
      const toName = to.replace(/_/g,' ');
      document.getElementById('uresult').textContent = formatNumber(result) + ' ' + toName;
      document.getElementById('uformula').textContent = val + ' ' + fromName + ' = ' + formatNumber(result) + ' ' + toName;
    }

    updateUnits();
  </script>
</body>
</html>
