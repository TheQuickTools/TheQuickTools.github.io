<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator - Strong Random Passwords | QuickTools</title>
  <meta name="description" content="Free password generator. Create strong, random passwords with customizable length and character types.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white'>⚡</text></svg>">
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header"><div class="header-inner"><a href="/" class="logo"><div class="logo-icon">⚡</div> QuickTools</a><button class="nav-toggle" aria-label="Menu">☰</button><nav class="nav"><a href="/#text" class="nav-link active">Text</a></nav></div></header>
  <main class="tool-page">
    <div class="breadcrumb"><a href="/">Home</a> <span>/</span> <a href="/#text">Text</a> <span>/</span> Password Generator</div>
    <h1>Password Generator</h1>
    <p class="tool-desc">Generate strong, random passwords. All generation happens in your browser.</p>

    <div class="result-card" style="background:transparent;border:none;padding:0;">
      <div class="form-group"><label>Length: <strong id="pwLenLabel">20</strong></label>
        <input type="range" id="pwLen" min="4" max="64" value="20" oninput="document.getElementById('pwLenLabel').textContent=this.value;genPw()">
      </div>
      <div class="form-row">
        <div class="form-group"><label><input type="checkbox" id="pwUpper" checked onchange="genPw()"> Uppercase (A-Z)</label></div>
        <div class="form-group"><label><input type="checkbox" id="pwLower" checked onchange="genPw()"> Lowercase (a-z)</label></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label><input type="checkbox" id="pwNumbers" checked onchange="genPw()"> Numbers (0-9)</label></div>
        <div class="form-group"><label><input type="checkbox" id="pwSymbols" checked onchange="genPw()"> Symbols (!@#$...)</label></div>
      </div>
      <div class="form-group"><button class="btn btn-primary" style="width:100%" onclick="genPw()">Generate Password</button></div>
    </div>

    <div class="result-card" style="text-align:center;">
      <div style="font-family:var(--font-mono);font-size:1.1rem;word-break:break-all;letter-spacing:1px;padding:12px 0;user-select:all;cursor:pointer;" id="pwOutput" onclick="copyText(this.textContent)"></div>
      <div style="margin-top:8px;">
        <span class="badge" id="pwStrength"></span>
        <span style="color:var(--text-dim);font-size:0.8rem;margin-left:8px;" id="pwEntropy"></span>
      </div>
    </div>

    <div class="result-card">
      <h3 style="font-size:1rem;margin-bottom:12px;">Generated Passwords</h3>
      <div class="result-details" id="pwHistory"></div>
    </div>
  </main>
  <footer class="footer"><div class="footer-links"><a href="/">Home</a></div><p>&copy; 2026 QuickTools.</p></footer>
  <script src="../js/app.js"></script>
  <script>
    let pwList = [];

    function genPw() {
      const len = parseInt(document.getElementById('pwLen').value);
      let chars = '';
      if (document.getElementById('pwUpper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if (document.getElementById('pwLower').checked) chars += 'abcdefghijklmnopqrstuvwxyz';
      if (document.getElementById('pwNumbers').checked) chars += '0123456789';
      if (document.getElementById('pwSymbols').checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
      if (!chars) chars = 'abcdefghijklmnopqrstuvwxyz';

      let pw = '';
      const arr = new Uint32Array(len);
      crypto.getRandomValues(arr);
      for (let i = 0; i < len; i++) pw += chars[arr[i] % chars.length];

      document.getElementById('pwOutput').textContent = pw;

      const entropy = Math.log2(chars.length) * len;
      const strEl = document.getElementById('pwStrength');
      if (entropy < 28) { strEl.textContent = 'Weak'; strEl.className = 'badge badge-red'; }
      else if (entropy < 50) { strEl.textContent = 'Fair'; strEl.className = 'badge badge-yellow'; }
      else if (entropy < 70) { strEl.textContent = 'Strong'; strEl.className = 'badge badge-green'; }
      else { strEl.textContent = 'Very Strong'; strEl.className = 'badge badge-green'; }
      document.getElementById('pwEntropy').textContent = Math.round(entropy) + ' bits of entropy';

      pwList.unshift(pw);
      if (pwList.length > 5) pwList.pop();
      const hist = document.getElementById('pwHistory');
      hist.innerHTML = '';
      pwList.forEach(p => {
        hist.innerHTML += `<div class="result-row" style="cursor:pointer;" onclick="copyText('${p}')"><span style="font-family:var(--font-mono);font-size:0.85rem;word-break:break-all;">${p}</span><span style="color:var(--text-dim);font-size:0.8rem;">click</span></div>`;
      });
    }
    genPw();
  </script>
</body>
</html>
