<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Base Converter - Binary, Hex, Decimal | QuickTools</title>
  <meta name="description" content="Free number base converter. Convert between binary, octal, decimal, hexadecimal, and other bases instantly.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white'>⚡</text></svg>">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1474582897184725" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header"><div class="header-inner"><a href="/" class="logo"><div class="logo-icon">⚡</div> QuickTools</a><button class="nav-toggle" aria-label="Menu">☰</button><nav class="nav"><a href="/#converters" class="nav-link active">Converters</a></nav></div></header>
  <main class="tool-page">
    <div class="breadcrumb"><a href="/">Home</a> <span>/</span> <a href="/#converters">Converters</a> <span>/</span> Number Base Converter</div>
    <h1>Number Base Converter</h1>
    <p class="tool-desc">Convert between binary, octal, decimal, hexadecimal, and custom bases.</p>

    <div class="result-card" style="background:transparent;border:none;padding:0;">
      <div class="form-group"><label>Input Value</label><input type="text" id="nbInput" value="255" oninput="convertBase()"></div>
      <div class="form-row">
        <div class="form-group"><label>From Base</label>
          <select id="nbFrom" onchange="convertBase()">
            <option value="10" selected>Decimal (10)</option>
            <option value="2">Binary (2)</option>
            <option value="8">Octal (8)</option>
            <option value="16">Hexadecimal (16)</option>
          </select>
        </div>
        <div class="form-group"><label>To Base</label>
          <select id="nbTo" onchange="convertBase()">
            <option value="2">Binary (2)</option>
            <option value="8">Octal (8)</option>
            <option value="10">Decimal (10)</option>
            <option value="16" selected>Hexadecimal (16)</option>
          </select>
        </div>
      </div>
    </div>

    <div id="nbResults">
      <div class="result-card" style="text-align:center;">
        <div class="result-label">Result</div>
        <div class="result-value" id="nbResult" style="font-family:var(--font-mono);font-size:1.5rem;word-break:break-all;">-</div>
      </div>
      <div class="result-card">
        <div class="result-details">
          <div class="result-row"><span>Binary</span><span id="nbBin" style="font-family:var(--font-mono);font-size:0.85rem;word-break:break-all">-</span></div>
          <div class="result-row"><span>Octal</span><span id="nbOct" style="font-family:var(--font-mono)">-</span></div>
          <div class="result-row"><span>Decimal</span><span id="nbDec" style="font-family:var(--font-mono)">-</span></div>
          <div class="result-row"><span>Hexadecimal</span><span id="nbHex" style="font-family:var(--font-mono)">-</span></div>
        </div>
      </div>
    </div>
  </main>
  <footer class="footer"><div class="footer-links"><a href="/">Home</a></div><p>&copy; 2026 QuickTools.</p></footer>
  <script src="../js/app.js"></script>
  <script>
    function convertBase() {
      const input = document.getElementById('nbInput').value.trim();
      const fromBase = parseInt(document.getElementById('nbFrom').value);
      const toBase = parseInt(document.getElementById('nbTo').value);

      try {
        const decimal = parseInt(input, fromBase);
        if (isNaN(decimal)) throw 'invalid';
        const result = decimal.toString(toBase).toUpperCase();
        document.getElementById('nbResult').textContent = result;
        document.getElementById('nbBin').textContent = decimal.toString(2);
        document.getElementById('nbOct').textContent = decimal.toString(8);
        document.getElementById('nbDec').textContent = decimal.toString(10);
        document.getElementById('nbHex').textContent = decimal.toString(16).toUpperCase();
      } catch(e) {
        document.getElementById('nbResult').textContent = 'Invalid input';
      }
    }
    convertBase();
  </script>
</body>
</html>
