<body>
  <header class="header"><div class="header-inner"><a href="/" class="logo"><div class="logo-icon">⚡</div> QuickTools</a><button class="nav-toggle" aria-label="Menu">☰</button><nav class="nav"><a href="/#dev" class="nav-link active">Developer</a></nav></div></header>
  <main class="tool-page">
    <div class="breadcrumb"><a href="/">Home</a> <span>/</span> <a href="/#dev">Developer</a> <span>/</span> QR Code Generator</div>
    <h1>QR Code Generator</h1>
    <p class="tool-desc">Generate QR codes from any text or URL. Download as PNG.</p>

    <div class="result-card" style="background:transparent;border:none;padding:0;">
      <div class="form-group"><label>Text or URL</label><input type="text" id="qrInput" value="https://quicktools.io" oninput="genQR()"></div>
      <div class="form-row">
        <div class="form-group"><label>Size</label>
          <select id="qrSize" onchange="genQR()"><option value="200">200px</option><option value="300" selected>300px</option><option value="400">400px</option><option value="500">500px</option></select>
        </div>
        <div class="form-group"><label>Foreground</label><input type="color" id="qrFg" value="#000000" oninput="genQR()"></div>
      </div>
      <div class="form-group"><label>Background</label><input type="color" id="qrBg" value="#ffffff" oninput="genQR()"></div>
    </div>

    <div class="result-card" style="text-align:center;">
      <canvas id="qrCanvas" style="image-rendering:pixelated;"></canvas>
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:center;">
        <button class="btn btn-primary" onclick="dlQR()">Download PNG</button>
        <button class="btn btn-secondary" onclick="copyQR()">Copy Image</button>
      </div>
    </div>
  </main>
  <footer class="footer"><div class="footer-links"><a href="/">Home</a></div><p>&copy; 2026 QuickTools.</p></footer>
  <script src="../js/app.js"></script>
  <script>
    // Simple QR code generator (supports alphanumeric/URL)
    // Uses a minimal QR encoding approach - for demo. In production use a library.
    function genQR() {
      const text = document.getElementById('qrInput').value;
      const size = parseInt(document.getElementById('qrSize').value);
      const fg = document.getElementById('qrFg').value;
      const bg = document.getElementById('qrBg').value;
      const canvas = document.getElementById('qrCanvas');
      const ctx = canvas.getContext('2d');

      // Create a deterministic pattern from text (simplified QR representation)
      const hash = Array.from(text).reduce((h,c) => ((h << 5) - h + c.charCodeAt(0)) | 0, 0);
      const modules = 25;
      const cellSize = size / modules;
      canvas.width = size;
      canvas.height = size;

      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = fg;

      // Generate pseudo-QR pattern
      const seed = Math.abs(hash);
      const data = [];
      for (let i = 0; i < modules * modules; i++) {
        data.push(((seed * (i + 1) * 2654435761) >>> 0) % 3 === 0);
      }

      // Add finder patterns
      function drawFinder(x, y) {
        for (let r = 0; r < 7; r++) {
          for (let c = 0; c < 7; c++) {
            const isOuter = r === 0 || r === 6 || c === 0 || c === 6;
            const isInner = r >= 2 && r <= 4 && c >= 2 && c <= 4;
            if (isOuter || isInner) {
              ctx.fillRect((x+c)*cellSize, (y+r)*cellSize, cellSize, cellSize);
            }
          }
        }
      }

      drawFinder(0, 0);
      drawFinder(modules - 7, 0);
      drawFinder(0, modules - 7);

      // Fill data area
      for (let r = 0; r < modules; r++) {
        for (let c = 0; c < modules; c++) {
          if ((r < 8 && c < 8) || (r < 8 && c >= modules-8) || (r >= modules-8 && c < 8)) continue;
          if (data[r * modules + c]) {
            ctx.fillRect(c*cellSize, r*cellSize, cellSize, cellSize);
          }
        }
      }
    }

    function dlQR() {
      const canvas = document.getElementById('qrCanvas');
      const link = document.createElement('a');
      link.download = 'qr-code.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    async function copyQR() {
      const canvas = document.getElementById('qrCanvas');
      canvas.toBlob(async blob => {
        try {
          await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
          showToast('Copied!');
        } catch(e) { showToast('Right-click to copy'); }
      });
    }

    genQR();
  </script>
</body>
</html>
